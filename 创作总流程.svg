<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="title flow">
  <title id="title">创作总流程</title>
  <desc id="flow">从 AI 规划、提示词时间轴、提示词编辑、H3 分段生成到视频制作的流程示意图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748B" />
    </marker>
  </defs>
  <rect width="1240" height="420" rx="28" fill="#F8FAFC" />
  <text x="62" y="64" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#0F172A">从需求到成片</text>
  <text x="62" y="102" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" fill="#475569">五个页面接力完成一条长视频，每一步都能保存和局部返工。</text>

  <g>
    <rect x="62" y="140" width="190" height="215" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="157" cy="196" r="29" fill="#0F766E" />
    <text x="157" y="206" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
    <text x="157" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#0F172A">AI 规划</text>
    <text x="157" y="292" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#475569">素材＋需求</text>
    <rect x="105" y="318" width="104" height="12" rx="6" fill="#E2E8F0" />
  </g>
  <line x1="258" y1="248" x2="290" y2="248" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <g>
    <rect x="298" y="140" width="190" height="215" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="393" cy="196" r="29" fill="#0F766E" />
    <text x="393" y="206" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
    <text x="393" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#0F172A">时间轴</text>
    <text x="393" y="292" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#475569">段序与时长</text>
    <rect x="341" y="314" width="104" height="9" rx="4" fill="#E2E8F0" />
    <rect x="341" y="329" width="72" height="9" rx="4" fill="#E2E8F0" />
  </g>
  <line x1="494" y1="248" x2="526" y2="248" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <g>
    <rect x="534" y="140" width="190" height="215" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="629" cy="196" r="29" fill="#0F766E" />
    <text x="629" y="206" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
    <text x="629" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#0F172A">提示词编辑</text>
    <text x="629" y="292" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#475569">生成方式</text>
    <path d="M588 321 L607 321 L642 294 L670 321" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" fill="none" />
  </g>
  <line x1="730" y1="248" x2="762" y2="248" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <g>
    <rect x="770" y="140" width="190" height="215" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="865" cy="196" r="29" fill="#0F766E" />
    <text x="865" y="206" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">4</text>
    <text x="865" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#0F172A">H3 分段生成</text>
    <text x="865" y="292" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#475569">官方节点运行</text>
    <circle cx="865" cy="323" r="17" fill="#E2E8F0" />
    <path d="M859 316 L876 323 L859 330 Z" fill="#64748B" />
  </g>
  <line x1="966" y1="248" x2="998" y2="248" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <g>
    <rect x="1006" y="140" width="190" height="215" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="1101" cy="196" r="29" fill="#0F766E" />
    <text x="1101" y="206" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">5</text>
    <text x="1101" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" fill="#0F172A">视频制作</text>
    <text x="1101" y="292" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#475569">拼接与导出</text>
    <rect x="1054" y="308" width="48" height="32" rx="8" fill="#E2E8F0" />
    <rect x="1106" y="308" width="48" height="32" rx="8" fill="none" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <text x="62" y="394" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#475569">先完成短片闭环，再增加时长、分辨率和后期复杂度。</text>
</svg>
